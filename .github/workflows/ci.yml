name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: the checks only read the checkout, so the workflow needs no write tokens.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run dependency-free checks
        run: node scripts/verify.mjs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build the local Chrome Web Store ZIP
        run: python scripts/package.py
